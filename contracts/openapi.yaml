components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token (JWT, about 1 hour)
    sessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Firebase session cookie from `POST /api/session`.
  responses:
    ValidationError:
      content:
        application/json:
          schema:
            $ref: ./schemas/common.yaml#/Error
      description: The request itself is invalid. One entry per field in `error.details.fields`. Sending it again
        fails the same way.
    Unauthorized:
      content:
        application/json:
          schema:
            $ref: ./schemas/common.yaml#/Error
      description: Not signed in, or the token or session cookie is invalid or expired (answered by the gateway).
        Sign in again.
    Forbidden:
      content:
        application/json:
          schema:
            $ref: ./schemas/common.yaml#/Error
      description: Signed in, but missing the role this call needs, or the action belongs to someone else.
    NotFound:
      content:
        application/json:
          schema:
            $ref: ./schemas/common.yaml#/Error
      description: |
        `request_unavailable`: the request does not exist or the caller may not see it. Both get the same
        answer, so a hidden request is never revealed (NFR03).
  schemas:
    CategoryWithWeight:
      type: object
      additionalProperties: false
      required:
        - categoryId
        - name
        - wasteType
        - standardWeightKg
      properties:
        categoryId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        wasteType:
          type: string
          minLength: 1
        standardWeightKg:
          $ref: ./schemas/common.yaml#/Decimal
    Facility:
      type: object
      description: A recycling facility. Its address is public, unlike a resident's.
      additionalProperties: false
      required:
        - facilityId
        - name
        - street
        - postalCode
        - specialInstructions
        - acceptedCategoryIds
      properties:
        facilityId:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        street:
          type: string
          minLength: 1
        postalCode:
          $ref: ./schemas/common.yaml#/PostalCode
        specialInstructions:
          type:
            - string
            - 'null'
        acceptedCategoryIds:
          type: array
          items:
            type: string
            minLength: 1
    PhotoRef:
      type: object
      additionalProperties: false
      required:
        - fileId
      properties:
        fileId:
          type: string
          minLength: 1
          description: The ImageKit `fileId` returned by the upload (README 6.4).
    UploadRequest:
      type: object
      additionalProperties: false
      required:
        - purpose
        - fileName
        - contentType
        - sizeBytes
      properties:
        purpose:
          type: string
          enum:
            - item_photo
            - delivery_evidence
        requestId:
          type: string
          format: uuid
          description: Required for `delivery_evidence`.
        fileName:
          type: string
          minLength: 1
        contentType:
          type: string
          enum:
            - image/jpeg
            - image/png
            - image/webp
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 10485760
    UploadTicket:
      type: object
      additionalProperties: false
      required:
        - uploadUrl
        - token
        - fields
        - expiresAt
      properties:
        uploadUrl:
          type: string
          format: uri
        token:
          type: string
          minLength: 1
          description: One-time JWT signed with the ImageKit private key. It pins every value in `fields`.
        fields:
          type: object
          description: Send every entry unchanged with the file (README 6.3).
          additionalProperties: false
          required:
            - fileName
            - folder
            - isPrivateFile
            - useUniqueFileName
            - overwriteFile
            - checks
            - transformation
          properties:
            fileName:
              type: string
              minLength: 1
            folder:
              type: string
              minLength: 1
            isPrivateFile:
              const: true
            useUniqueFileName:
              const: false
            overwriteFile:
              const: false
            checks:
              type: string
              minLength: 1
            transformation:
              type: string
              minLength: 1
              description: 'The JSON string to send as is: `{"pre":"md-false"}` (strips all metadata, including
                GPS).'
        expiresAt:
          $ref: ./schemas/common.yaml#/Timestamp
    CreateRequests:
      type: object
      additionalProperties: false
      required:
        - items
        - windows
        - termsDocumentId
      properties:
        items:
          type: array
          minItems: 1
          description: One request per item. Each `categoryId` at most once.
          items:
            type: object
            additionalProperties: false
            required:
              - categoryId
              - quantity
            properties:
              categoryId:
                type: string
                minLength: 1
              quantity:
                type: integer
                minimum: 1
              photo:
                $ref: '#/components/schemas/PhotoRef'
        windows:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: ./schemas/common.yaml#/PickupWindowInput
          description: |
            1 to 3 distinct slots. Each starts in the future and ends by `createdAt + 30 days`
            (the original `createdAt` when editing). Times are decided in Calgary time with the database clock.
        notes:
          type: string
        termsDocumentId:
          type: string
          minLength: 1
          description: The terms document the resident just acknowledged. Must be the current one.
    CreatedRequest:
      type: object
      additionalProperties: false
      required:
        - requestId
        - category
        - quantity
        - estimatedWeightKg
        - status
        - createdAt
        - expiresAt
      properties:
        requestId:
          type: string
          format: uuid
        category:
          $ref: ./schemas/common.yaml#/Category
        quantity:
          type: integer
          minimum: 1
        estimatedWeightKg:
          $ref: ./schemas/common.yaml#/Decimal
        status:
          const: Open
        createdAt:
          $ref: ./schemas/common.yaml#/Timestamp
        expiresAt:
          allOf:
            - $ref: ./schemas/common.yaml#/Timestamp
          description: The start of the last active window.
    MyRequest:
      type: object
      description: A resident's own request in a list. The photo itself and the address are only in the detail (Q8).
      additionalProperties: false
      required:
        - requestId
        - category
        - quantity
        - estimatedWeightKg
        - status
        - createdAt
        - expiresAt
        - hasPhoto
      properties:
        requestId:
          type: string
          format: uuid
        category:
          $ref: ./schemas/common.yaml#/Category
        quantity:
          type: integer
          minimum: 1
        estimatedWeightKg:
          $ref: ./schemas/common.yaml#/Decimal
        status:
          $ref: ./schemas/common.yaml#/RequestStatus
        createdAt:
          $ref: ./schemas/common.yaml#/Timestamp
        expiresAt:
          $ref: ./schemas/common.yaml#/Timestamp
        hasPhoto:
          type: boolean
    AvailableRequest:
      type: object
      description: What any volunteer sees. No street address, no notes, no photo and no resident name, and no other
        field can be added (NFR03).
      additionalProperties: false
      required:
        - requestId
        - category
        - quantity
        - estimatedWeightKg
        - postalCode
        - windows
        - expiresAt
        - hasPhoto
      properties:
        requestId:
          type: string
          format: uuid
        category:
          $ref: ./schemas/common.yaml#/Category
        quantity:
          type: integer
          minimum: 1
        estimatedWeightKg:
          $ref: ./schemas/common.yaml#/Decimal
        postalCode:
          $ref: ./schemas/common.yaml#/PostalCode
        windows:
          type: array
          minItems: 1
          items:
            $ref: ./schemas/common.yaml#/PickupWindow
          description: Future windows only.
        expiresAt:
          $ref: ./schemas/common.yaml#/Timestamp
        hasPhoto:
          type: boolean
    VolunteerAssignment:
      type: object
      description: |
        One row per assignment of the caller: the volunteer's history (Q7). For an assignment that ended as
        Volunteer_Cancelled, Resident_Cancelled or Missed_Pickup, only `requestId` and `assignment` are filled and
        the rest is null, because the volunteer is no longer linked to the request.
      additionalProperties: false
      required:
        - requestId
        - category
        - quantity
        - estimatedWeightKg
        - postalCode
        - status
        - assignment
      properties:
        requestId:
          type: string
          format: uuid
        category:
          oneOf:
            - $ref: ./schemas/common.yaml#/Category
            - type: 'null'
        quantity:
          type:
            - integer
            - 'null'
          minimum: 1
        estimatedWeightKg:
          oneOf:
            - $ref: ./schemas/common.yaml#/Decimal
            - type: 'null'
        postalCode:
          oneOf:
            - $ref: ./schemas/common.yaml#/PostalCode
            - type: 'null'
        status:
          oneOf:
            - $ref: ./schemas/common.yaml#/RequestStatus
            - type: 'null'
        assignment:
          type: object
          additionalProperties: false
          required:
            - assignmentId
            - window
            - status
            - acceptedAt
            - collectedAt
            - endedAt
            - endReason
          properties:
            assignmentId:
              type: string
              minLength: 1
            window:
              $ref: ./schemas/common.yaml#/PickupWindow
            status:
              $ref: ./schemas/common.yaml#/AssignmentStatus
            acceptedAt:
              $ref: ./schemas/common.yaml#/Timestamp
            collectedAt:
              oneOf:
                - $ref: ./schemas/common.yaml#/Timestamp
                - type: 'null'
            endedAt:
              oneOf:
                - $ref: ./schemas/common.yaml#/Timestamp
                - type: 'null'
            endReason:
              type:
                - string
                - 'null'
              enum:
                - Delivered
                - Volunteer_Cancelled
                - Resident_Cancelled
                - Missed_Pickup
                - null
    PublicPerson:
      type: object
      additionalProperties: false
      required:
        - accountId
        - publicName
      properties:
        accountId:
          $ref: ./schemas/common.yaml#/AccountId
        publicName:
          type: string
          minLength: 1
    RequestDetail:
      type: object
      description: |
        A single request. Which optional fields are present depends on who is asking (README 5.2, visibility table).
        Anyone who is not allowed to see the request gets `404 request_unavailable` instead.
      additionalProperties: false
      required:
        - requestId
        - status
        - category
        - quantity
        - estimatedWeightKg
        - postalCode
        - windows
        - createdAt
        - expiresAt
        - viewer
        - allowedActions
        - refreshAt
      properties:
        requestId:
          type: string
          format: uuid
        status:
          $ref: ./schemas/common.yaml#/RequestStatus
        category:
          $ref: ./schemas/common.yaml#/Category
        quantity:
          type: integer
          minimum: 1
        estimatedWeightKg:
          $ref: ./schemas/common.yaml#/Decimal
        postalCode:
          $ref: ./schemas/common.yaml#/PostalCode
        windows:
          type: array
          items:
            $ref: ./schemas/common.yaml#/PickupWindow
          description: Active windows. A volunteer viewing an Open request sees future windows only.
        createdAt:
          $ref: ./schemas/common.yaml#/Timestamp
        expiresAt:
          $ref: ./schemas/common.yaml#/Timestamp
        notes:
          type:
            - string
            - 'null'
          description: Owner, and the volunteer while their assignment is Active.
        address:
          $ref: ./schemas/common.yaml#/Address
          description: Owner, and the volunteer while their assignment is Active.
        photoUrl:
          type:
            - string
            - 'null'
          format: uri
          description: Item photo, signed for about 10 minutes. Never stored and never in events. Owner and volunteers.
        resident:
          $ref: '#/components/schemas/PublicPerson'
          description: Owner and the assigned or delivering volunteer.
        assignment:
          oneOf:
            - type: object
              description: The owner sees the current or last assignment; a volunteer sees only their own.
              additionalProperties: false
              required:
                - assignmentId
                - volunteer
                - window
                - status
                - acceptedAt
                - collectedAt
                - endedAt
                - endReason
                - outsideCancellationWindow
              properties:
                assignmentId:
                  type: string
                  minLength: 1
                volunteer:
                  $ref: '#/components/schemas/PublicPerson'
                window:
                  $ref: ./schemas/common.yaml#/PickupWindow
                status:
                  $ref: ./schemas/common.yaml#/AssignmentStatus
                acceptedAt:
                  $ref: ./schemas/common.yaml#/Timestamp
                collectedAt:
                  oneOf:
                    - $ref: ./schemas/common.yaml#/Timestamp
                    - type: 'null'
                endedAt:
                  oneOf:
                    - $ref: ./schemas/common.yaml#/Timestamp
                    - type: 'null'
                endReason:
                  type:
                    - string
                    - 'null'
                  enum:
                    - Delivered
                    - Volunteer_Cancelled
                    - Resident_Cancelled
                    - Missed_Pickup
                    - null
                outsideCancellationWindow:
                  type: boolean
                  description: True once it is less than 24 hours before the selected window starts.
            - type: 'null'
        delivery:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - facility
                - deliveredAt
              properties:
                facility:
                  type: object
                  additionalProperties: false
                  required:
                    - facilityId
                    - name
                  properties:
                    facilityId:
                      type: string
                      minLength: 1
                    name:
                      type: string
                      minLength: 1
                deliveredAt:
                  $ref: ./schemas/common.yaml#/Timestamp
                evidencePhotoUrl:
                  type: string
                  format: uri
                  description: Signed, about 10 minutes. Owner and the delivering volunteer only.
            - type: 'null'
        rescheduledFrom:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - requestId
              properties:
                requestId:
                  type: string
                  format: uuid
            - type: 'null'
        rescheduledAs:
          oneOf:
            - type: object
              additionalProperties: false
              required:
                - requestId
              properties:
                requestId:
                  type: string
                  format: uuid
            - type: 'null'
        statusHistory:
          type: array
          description: Owner only.
          items:
            type: object
            additionalProperties: false
            required:
              - status
              - changedAt
              - reason
            properties:
              status:
                $ref: ./schemas/common.yaml#/RequestStatus
              changedAt:
                $ref: ./schemas/common.yaml#/Timestamp
              reason:
                type:
                  - string
                  - 'null'
        viewer:
          type: string
          description: How the caller relates to the request, for example `owner`. Decides which fields are present.
        allowedActions:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - edit
              - cancel
              - cancel_assignment
              - confirm_collected
              - report_missed
              - accept
              - record_delivery
          description: Computed by the server from status, role and timing, so the frontend never re-implements
            the rules. The server still checks every action.
        refreshAt:
          type:
            - string
            - 'null'
          format: date-time
          description: The next moment the server would answer differently from the same data (README 5.2), or null.
