    EditRequest:
      type: object
      description: 'Any of these. `windows` replaces the active windows; `photo: null` removes the photo.'
      additionalProperties: false
      required: []
      properties:
        categoryId:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        notes:
          type:
            - string
            - 'null'
        windows:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: ./schemas/common.yaml#/PickupWindowInput
          description: |
            1 to 3 distinct slots. Each starts in the future and ends by `createdAt + 30 days`
            (the original `createdAt` when editing). Times are decided in Calgary time with the database clock.
        photo:
          oneOf:
            - $ref: '#/components/schemas/PhotoRef'
            - type: 'null'
      minProperties: 1
    CancelRequest:
      type: object
      additionalProperties: false
      required: []
      properties:
        reason:
          type: string
    AcceptRequest:
      type: object
      additionalProperties: false
      required:
        - windowId
        - termsDocumentId
      properties:
        windowId:
          type: string
          minLength: 1
          description: One of this request's active windows that has not started yet.
        termsDocumentId:
          type: string
          minLength: 1
    CancelAssignment:
      type: object
      additionalProperties: false
      required: []
      properties:
        as:
          type: string
          enum:
            - resident
            - volunteer
          description: Only when the caller is both the owner and the assigned volunteer.
        reason:
          type: string
        windows:
          type: array
          minItems: 1
          maxItems: 3
          items:
            $ref: ./schemas/common.yaml#/PickupWindowInput
          description: 'Resident only: replaces the active windows before the request reopens.'
    ReportMissed:
      type: object
      additionalProperties: false
      required: []
      properties:
        reason:
          type: string
        reschedule:
          type: object
          description: Creates a new Open request linked to the missed one, in the same transaction.
          additionalProperties: false
          required:
            - windows
            - termsDocumentId
          properties:
            windows:
              type: array
              minItems: 1
              maxItems: 3
              items:
                $ref: ./schemas/common.yaml#/PickupWindowInput
              description: |
                1 to 3 distinct slots. Each starts in the future and ends by `createdAt + 30 days`
                (the original `createdAt` when editing). Times are decided in Calgary time with the database clock.
            termsDocumentId:
              type: string
              minLength: 1
    RecordDelivery:
      type: object
      additionalProperties: false
      required:
        - facilityId
        - evidencePhoto
      properties:
        facilityId:
          type: string
          minLength: 1
        evidencePhoto:
          $ref: '#/components/schemas/PhotoRef'
