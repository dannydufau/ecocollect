  consumeNotificationEvents:
    action: receive
    channel:
      $ref: '#/channels/notificationEvents'
    title: Notification Service consumes notification.events
    description: |
      Manual ack after the database work commits, with `prefetch = 1`. Each event id is recorded
      in this consumer's processed-events table in the same transaction, and a repeat is skipped.
      On failure: roll back, then `basic.reject` with `requeue = true`. An unusable message (bad
      JSON, unknown type, invalid envelope): `basic.reject` with `requeue = false`.
    bindings:
      amqp:
        ack: true
    messages:
      - $ref: '#/channels/notificationEvents/messages/requestCreated'
      - $ref: '#/channels/notificationEvents/messages/requestUpdated'
      - $ref: '#/channels/notificationEvents/messages/requestAssigned'
      - $ref: '#/channels/notificationEvents/messages/requestAssignmentCollected'
