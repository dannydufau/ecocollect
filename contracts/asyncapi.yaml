            type: NotificationCleanupRequested
            version: 1
            occurredAt: '2026-11-23T10:00:00Z'
            producer: cleanup-service
            traceId: null
            data:
              requestedAt: '2026-11-23T10:00:00Z'
    ProfileUpdated:
      name: ProfileUpdated
      title: A profile changed (U7) or a role was activated (U8)
      contentType: application/json
      description: 'E15. A profile changed (U7) or a role was activated (U8). Routing key `user.profile.updated`.
        Consumed by: Notification Service.'
      correlationId:
        location: $message.payload#/eventId
      bindings:
        amqp:
          messageType: ProfileUpdated
      payload:
        $ref: '#/components/schemas/ProfileUpdatedPayload'
      examples:
        - name: A volunteer activated the resident role
          payload:
            eventId: 0000000f-0b9e-4a2c-8d1e-5f6a7b8c9d0e
            type: ProfileUpdated
            version: 1
            occurredAt: '2026-11-20T15:00:00Z'
            producer: user-service
            traceId: 4f1d2c3b-a5e6-4f70-8192-a3b4c5d6e7f8
            data:
              accountId: danny
              changed:
                - roles
              publicName: Danny
              roles:
                - resident
                - volunteer
    AccountDeactivated:
      name: AccountDeactivated
      title: An account was deactivated (U9)
      contentType: application/json
      description: 'E16. An account was deactivated (U9). Routing key `user.account.deactivated`. Consumed by: Notification
        Service.'
      correlationId:
        location: $message.payload#/eventId
      bindings:
        amqp:
          messageType: AccountDeactivated
      payload:
        $ref: '#/components/schemas/AccountDeactivatedPayload'
      examples:
        - name: An account was deactivated
          payload:
            eventId: 00000010-0b9e-4a2c-8d1e-5f6a7b8c9d0e
            type: AccountDeactivated
            version: 1
            occurredAt: '2026-11-25T17:00:00Z'
            producer: user-service
            traceId: 4f1d2c3b-a5e6-4f70-8192-a3b4c5d6e7f8
            data:
              accountId: vedant
              deactivatedAt: '2026-11-25T17:00:00Z'
    SseReady:
      name: ready
      title: The stream is open
      contentType: application/json
      description: |
        The first frame on every new stream, and sent only once per connection. On the wire:

        ```
        event: ready
        data: {}
        ```

        It carries no data. It tells the browser the stream is live: the connection is registered
        and can receive signals. The frontend does not need to listen for it, because `onopen`
        fires as soon as it is written, but it can.
      payload:
        $ref: '#/components/schemas/SseReadyPayload'
      examples:
        - name: A new stream
          payload: {}
    SseSignal:
      name: signal
      title: A signal for the signed-in user
      contentType: application/json
      description: |
        Sent as a Server-Sent Event, after the `ready` event that every stream starts with. On the
        wire it is two lines and a blank line:

        ```
        event: signal
        data: <the payload as one line of JSON>
        ```

        There is no `id` line, because nothing is stored: a connection that drops does not
        get the messages it missed.

        The message is only a signal. The frontend refetches from the REST API to get fresh data:
        the available requests for `NEW_MATCHING_REQUEST`, and the resident's own requests
        for `REQUEST_CREATED`. There is no stored inbox to refetch for Oct 28.
        A signal missed while disconnected is not replayed. The frontend refetches in `onopen` instead.
      payload:
        $ref: '#/components/schemas/SseSignalPayload'
      examples:
        - name: A volunteer is told about a new request
          payload:
            type: NEW_MATCHING_REQUEST
            requestId: 0b7e3f2a-6d1c-4a52-9a43-6a1f5e0f1c11
  schemas:
    EventEnvelope:
      type: object
      description: |
        The outside of every event (README 10.1). Consumers ignore fields they do not know, so adding a
        field never breaks them. `version` is per event type: a change that removes a field or changes
        what one means gets a new version.
      required:
        - eventId
        - type
        - version
        - occurredAt
        - producer
        - traceId
        - data
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique per event. It is also the AMQP `messageId`, and consumers use it to skip duplicates.
        type:
          type: string
          description: The event name, also the AMQP `type` property.
        version:
          type: integer
          minimum: 1
        occurredAt:
          $ref: ./schemas/common.yaml#/Timestamp
        producer:
          type: string
          enum:
            - request-service
            - reward-service
            - cleanup-service
            - user-service
        traceId:
          type:
            - string
            - 'null'
          description: The `X-Request-Id` of the HTTP call that caused the event, or null when no call did (a scheduled
            job, or an event caused by another event).
        data:
          type: object
    RequestSnapshot:
      type: object
      description: |
        The request after the change (README 10.2). It is in every `Request*` event as `data.request`.
        Never a street address, notes or a photo.
      required:
        - requestId
        - requestSeq
        - transitionId
        - status
        - residentUid
        - categoryId
        - categoryName
        - wasteType
        - quantity
        - estimatedWeightKg
        - postalCode
        - windows
        - createdAt
        - expiresAt
      properties:
        requestId:
          type: string
          format: uuid
        requestSeq:
          type: integer
          minimum: 1
          description: Counter per request, +1 for every event about it, set under the request row lock. Two events
            from one action get consecutive numbers. Consumers order by this, not by arrival (README 11).
        transitionId:
          type: string
          format: uuid
          description: One per action (per transaction). Events from the same action share it.
        status:
          $ref: ./schemas/common.yaml#/RequestStatus
        residentUid:
          $ref: ./schemas/common.yaml#/AccountId
        categoryId:
          type: string
          minLength: 1
        categoryName:
          type: string
          minLength: 1
        wasteType:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        estimatedWeightKg:
          $ref: ./schemas/common.yaml#/Decimal
        postalCode:
          $ref: ./schemas/common.yaml#/PostalCode
        windows:
          type: array
          maxItems: 3
          description: Active windows only.
          items:
            $ref: ./schemas/common.yaml#/PickupWindow
        createdAt:
          $ref: ./schemas/common.yaml#/Timestamp
        expiresAt:
          allOf:
            - $ref: ./schemas/common.yaml#/Timestamp
          description: The start of the last active window (README 12.2).
    AssignmentSnapshot:
      type: object
      description: The assignment after the change, as `data.assignment` where an event has one (README 10.2).
      required:
        - assignmentId
        - volunteerUid
        - window
        - acceptedAt
        - collectedAt
        - endedAt
        - endReason
      properties:
        assignmentId:
          type: string
          minLength: 1
        volunteerUid:
          $ref: ./schemas/common.yaml#/AccountId
        window:
          allOf:
            - $ref: ./schemas/common.yaml#/PickupWindow
          description: The window the volunteer picked.
        acceptedAt:
          $ref: ./schemas/common.yaml#/Timestamp
        collectedAt:
          oneOf:
            - $ref: ./schemas/common.yaml#/Timestamp
            - type: 'null'
        endedAt:
          oneOf:
            - $ref: ./schemas/common.yaml#/Timestamp
            - type: 'null'
        endReason:
          type:
            - string
            - 'null'
          enum:
            - Delivered
            - Volunteer_Cancelled
            - Resident_Cancelled
            - Missed_Pickup
            - null
          description: Set together with `endedAt` when the assignment ends.
    PointsAward:
      type: object
      required:
        - awardId
        - accountId
        - earnedAs
        - points
        - formula
      properties:
        awardId:
          type: string
          minLength: 1
        accountId:
          $ref: ./schemas/common.yaml#/AccountId
        earnedAs:
          type: string
          enum:
            - resident
            - volunteer
        points:
          $ref: ./schemas/common.yaml#/Decimal
        formula:
          type: string
          enum:
            - VOLUNTEER
            - RESIDENT
    RequestCreatedData:
      type: object
      required:
        - request
        - matchedVolunteerUids
        - rescheduledFromRequestId
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        matchedVolunteerUids:
          type: array
          items:
            $ref: ./schemas/common.yaml#/AccountId
          description: |
            Every volunteer whose preferred postal codes include the request's postal code, leaving out
            deactivated accounts and the request's own resident (in demo mode the resident stays in).
            A snapshot from the same transaction. It can be empty.
        rescheduledFromRequestId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: The missed request this one reschedules (Q14), otherwise null.
    RequestCreatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestCreated
            version:
              const: 2
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestCreatedData'
    RequestUpdatedData:
      type: object
      required:
        - request
        - reason
        - matchedVolunteerUids
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        reason:
          type: string
          enum:
            - edited
            - reopened
        changed:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - category
              - quantity
              - notes
              - windows
              - photo
          description: 'Only when `reason` is `edited`: what the resident changed.'
        matchedVolunteerUids:
          type: array
          items:
            $ref: ./schemas/common.yaml#/AccountId
          description: |
            Every volunteer whose preferred postal codes include the request's postal code, leaving out
            deactivated accounts and the request's own resident (in demo mode the resident stays in).
            A snapshot from the same transaction. It can be empty.
    RequestUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestUpdated
            version:
              const: 1
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestUpdatedData'
    RequestAssignedData:
      type: object
      required:
        - request
        - assignment
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        assignment:
          $ref: '#/components/schemas/AssignmentSnapshot'
    RequestAssignedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestAssigned
            version:
              const: 1
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestAssignedData'
    RequestAssignmentCollectedData:
      type: object
      required:
        - request
        - assignment
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        assignment:
          $ref: '#/components/schemas/AssignmentSnapshot'
    RequestAssignmentCollectedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestAssignmentCollected
            version:
              const: 1
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestAssignmentCollectedData'
    RequestAssignmentDeliveredData:
      type: object
      required:
        - request
        - assignment
        - facility
        - deliveredAt
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        assignment:
          $ref: '#/components/schemas/AssignmentSnapshot'
        facility:
          type: object
          required:
            - facilityId
            - name
          properties:
            facilityId:
              type: string
              minLength: 1
            name:
              type: string
              minLength: 1
        deliveredAt:
          $ref: ./schemas/common.yaml#/Timestamp
    RequestAssignmentDeliveredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestAssignmentDelivered
            version:
              const: 1
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestAssignmentDeliveredData'
    RequestAssignmentCancelledResidentData:
      type: object
      required:
        - request
        - assignment
        - cancelledAt
        - outsideCancellationWindow
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        assignment:
          $ref: '#/components/schemas/AssignmentSnapshot'
        cancelledAt:
          $ref: ./schemas/common.yaml#/Timestamp
        outsideCancellationWindow:
          type: boolean
          description: |
            True when the cancellation came less than 24 hours before the selected window started.
            Decided by the Request Service at cancel time, so it never goes stale. The Reward Service
            awards cancellation points only when it is true.
    RequestAssignmentCancelledResidentPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestAssignmentCancelledResident
            version:
              const: 1
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestAssignmentCancelledResidentData'
    RequestAssignmentCancelledVolunteerData:
      type: object
      required:
        - request
        - assignment
        - cancelledAt
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        assignment:
          $ref: '#/components/schemas/AssignmentSnapshot'
        cancelledAt:
          $ref: ./schemas/common.yaml#/Timestamp
    RequestAssignmentCancelledVolunteerPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestAssignmentCancelledVolunteer
            version:
              const: 1
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestAssignmentCancelledVolunteerData'
    RequestAssignmentMissedData:
      type: object
      required:
        - request
        - assignment
        - reportedAt
        - rescheduledAsRequestId
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        assignment:
          $ref: '#/components/schemas/AssignmentSnapshot'
        reportedAt:
          $ref: ./schemas/common.yaml#/Timestamp
        rescheduledAsRequestId:
          oneOf:
            - type: string
              format: uuid
            - type: 'null'
          description: The new request when the resident rescheduled, otherwise null.
    RequestAssignmentMissedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestAssignmentMissed
            version:
              const: 1
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestAssignmentMissedData'
    RequestCancelledData:
      type: object
      required:
        - request
        - reason
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        reason:
          type:
            - string
            - 'null'
          description: The resident's reason, if they gave one.
    RequestCancelledPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestCancelled
            version:
              const: 1
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestCancelledData'
    RequestExpiredData:
      type: object
      required:
        - request
        - trigger
      properties:
        request:
          $ref: '#/components/schemas/RequestSnapshot'
        trigger:
          type: string
          enum:
            - cleanup_job
            - assignment_cancelled
            - overdue_on_action
          description: |
            `cleanup_job`: the Request Service confirmed a CleanupRequest. `assignment_cancelled`: an
            assignment was cancelled after `expiresAt`. `overdue_on_action`: an edit, cancel or accept
            found the Open request already overdue (README 12.6).
    RequestExpiredPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: RequestExpired
            version:
              const: 1
            producer:
              const: request-service
            data:
              $ref: '#/components/schemas/RequestExpiredData'
    PointsAwardedDeliveryData:
      type: object
      required:
        - requestId
        - assignmentId
        - categoryName
        - quantity
        - estimatedWeightKg
        - awards
      properties:
        requestId:
          type: string
          format: uuid
        assignmentId:
          type: string
          minLength: 1
        categoryName:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        estimatedWeightKg:
          $ref: ./schemas/common.yaml#/Decimal
        awards:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: '#/components/schemas/PointsAward'
          description: One award for the volunteer and one for the resident.
    PointsAwardedDeliveryPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: PointsAwardedDelivery
            version:
              const: 1
            producer:
              const: reward-service
            data:
              $ref: '#/components/schemas/PointsAwardedDeliveryData'
    PointsAwardedCancellationData:
      type: object
      required:
        - requestId
        - assignmentId
        - categoryName
        - quantity
        - estimatedWeightKg
        - awards
      properties:
        requestId:
          type: string
          format: uuid
        assignmentId:
          type: string
          minLength: 1
        categoryName:
          type: string
          minLength: 1
        quantity:
          type: integer
          minimum: 1
        estimatedWeightKg:
          $ref: ./schemas/common.yaml#/Decimal
        awards:
          type: array
          minItems: 1
          maxItems: 1
          items:
            $ref: '#/components/schemas/PointsAward'
          description: One award, for the volunteer.
    PointsAwardedCancellationPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: PointsAwardedCancellation
            version:
              const: 1
            producer:
              const: reward-service
            data:
              $ref: '#/components/schemas/PointsAwardedCancellationData'
    CleanupRequestData:
      type: object
      required:
        - requestId
        - requestSeq
        - expiresAt
      properties:
        requestId:
          type: string
          format: uuid
        requestSeq:
          type: integer
          minimum: 1
        expiresAt:
          $ref: ./schemas/common.yaml#/Timestamp
      description: 'Only a nudge. `requestSeq` and `expiresAt` are for logs: the Request Service locks the request
        and checks it again.'
    CleanupRequestPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: CleanupRequest
            version:
              const: 1
            producer:
              const: cleanup-service
            data:
              $ref: '#/components/schemas/CleanupRequestData'
    NotificationCleanupRequestedData:
      type: object
      required:
        - requestedAt
      properties:
        requestedAt:
          $ref: ./schemas/common.yaml#/Timestamp
    NotificationCleanupRequestedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: NotificationCleanupRequested
            version:
              const: 1
            producer:
              const: cleanup-service
            data:
              $ref: '#/components/schemas/NotificationCleanupRequestedData'
    ProfileUpdatedData:
      type: object
      required:
        - accountId
        - changed
        - publicName
        - roles
      properties:
        accountId:
          $ref: ./schemas/common.yaml#/AccountId
        changed:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - publicName
              - address
              - preferredPostalCodes
              - roles
        publicName:
          type: string
          minLength: 1
        roles:
          $ref: ./schemas/common.yaml#/Roles
      description: Says that the address changed, never what it is.
    ProfileUpdatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: ProfileUpdated
            version:
              const: 1
            producer:
              const: user-service
            data:
              $ref: '#/components/schemas/ProfileUpdatedData'
    AccountDeactivatedData:
      type: object
      required:
        - accountId
        - deactivatedAt
      properties:
        accountId:
          $ref: ./schemas/common.yaml#/AccountId
        deactivatedAt:
          $ref: ./schemas/common.yaml#/Timestamp
    AccountDeactivatedPayload:
      allOf:
        - $ref: '#/components/schemas/EventEnvelope'
        - properties:
            type:
              const: AccountDeactivated
            version:
              const: 1
            producer:
              const: user-service
            data:
              $ref: '#/components/schemas/AccountDeactivatedData'
    SseReadyPayload:
      type: object
      additionalProperties: false
      description: Empty on purpose. Nothing is sent with the ready event.
    SseSignalPayload:
      type: object
      additionalProperties: false
      required:
        - type
        - requestId
      properties:
        type:
          type: string
          enum:
            - REQUEST_CREATED
            - NEW_MATCHING_REQUEST
          description: |
            `REQUEST_CREATED` is the confirmation to the resident. `NEW_MATCHING_REQUEST` is the alert to a volunteer.
        requestId:
          type: string
          format: uuid
          description: The request to refetch. Nothing else about it is sent, so there is no street address.
