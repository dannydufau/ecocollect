      - $ref: '#/channels/notificationEvents/messages/requestAssignmentCancelledResident'
      - $ref: '#/channels/notificationEvents/messages/requestAssignmentCancelledVolunteer'
      - $ref: '#/channels/notificationEvents/messages/requestAssignmentMissed'
      - $ref: '#/channels/notificationEvents/messages/requestCancelled'
      - $ref: '#/channels/notificationEvents/messages/requestExpired'
      - $ref: '#/channels/notificationEvents/messages/pointsAwardedDelivery'
      - $ref: '#/channels/notificationEvents/messages/pointsAwardedCancellation'
      - $ref: '#/channels/notificationEvents/messages/notificationCleanupRequested'
