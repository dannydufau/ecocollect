  notificationEvents:
    address: notification.events
    title: Queue notification.events (Notification Service)
    description: |
      Quorum queue declared by the Notification Service when it starts, with exactly the arguments in
      `x-queue-arguments`, and bound to `ecocollect.events` with the keys in `x-bindings`. A
      message that fails 5 times goes to `notification.events.dlq` through `ecocollect.dlx`.

      The Notification Service runs as exactly one instance (README 13.0), which holds every SSE
      connection in memory and is the only consumer of this queue, so every event reaches the
      process that holds the recipient's connections. A second instance would take only some
      of the events and its users would miss live updates. Scaling out is deferred.
    servers:
      - $ref: '#/servers/rabbitmq'
    x-bindings:
      - request.#
      - reward.#
      - user.#
      - cleanup.notifications.due
    x-queue-arguments:
      x-queue-type: quorum
      x-delivery-limit: 4
      x-dead-letter-exchange: ecocollect.dlx
      x-dead-letter-routing-key: notification.events
    x-dead-letter-queue: notification.events.dlq
    bindings:
      amqp:
        is: queue
        queue:
          name: notification.events
          durable: true
          exclusive: false
          autoDelete: false
          vhost: /
    messages:
      requestCreated:
        $ref: '#/components/messages/RequestCreated'
      requestUpdated:
        $ref: '#/components/messages/RequestUpdated'
      requestAssigned:
        $ref: '#/components/messages/RequestAssigned'
      requestAssignmentCollected:
