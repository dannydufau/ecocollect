asyncapi: 3.0.0
info:
  title: EcoCollect events (Nov 9)
  version: 1.0.0
  description: |
    Every message in EcoCollect that is not a REST call, following the Nov 9 contracts in
    [README.md](./README.md) (sections 9 to 11). The REST calls are in [openapi.yaml](./openapi.yaml).
    This one file describes the services on both sides of each message, so every operation says which
    service does it.

    RabbitMQ

    - Exchanges: `ecocollect.events` (topic, durable) for every event, and `ecocollect.dlx` (direct,
      durable) for dead letters only.
    - Message properties: `messageId` is the `eventId`, `type` is the event type, `contentType` is
      `application/json`, and every message is persistent.
    - Publishing: every producer writes the event to its own outbox table in the same transaction as the
      change, so an event is never lost before it reaches RabbitMQ. A loop in the same process publishes
      unsent rows in order with publisher confirms, and marks a row sent only after the confirm.
    - Consuming: four quorum queues, one per consumer, each declared by its consumer with exactly the
      arguments listed on its channel (`x-queue-type` quorum, `x-delivery-limit` 4, dead-lettering to
      `ecocollect.dlx` with the queue's own name as routing key). Each consumer also declares
      `<queue>.dlq` (quorum, no other arguments) and binds it to `ecocollect.dlx` with the queue's name.
    - Failures: roll back, then `basic.reject` with `requeue = true`. Use `reject`, not `basic.nack`:
      only `reject` (or a lost connection) adds to the delivery count. RabbitMQ dead-letters the message
      on its 5th failure, so no service counts attempts itself. Log `eventId`, `type`, the queue, the
      error and `x-delivery-count` before every reject.

    Stale events

    An event says what was true when it happened. Every request event carries the request as it was
    after the change (`data.request`), with `requestSeq`, so consumers order by `requestSeq` and not
    by arrival. The producer is the only source of truth for current state: no consumer takes an
    irreversible decision from an event without asking the owner (README 11).

    Server-Sent Events

    The browser side (`/api/events`) is still the Oct 28 version here and is updated separately.

    No street address ever appears in an event or an SSE message.
servers:
