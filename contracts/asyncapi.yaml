asyncapi: 3.0.0
info:
  title: EcoCollect events (Oct 28)
  version: 0.1.0
  description: |
    The two messages in the Oct 28 flow:

    1. RequestCreated: the pickup service tells the notification service, through
       RabbitMQ, that a resident created a request.
    2. SseSignal: the notification service tells the browser, over the open
       `GET /api/events` stream, that there is something new.

    This one file describes the services on both sides of each message, so every operation
    says which service does it. The REST calls are in [openapi.yaml](./openapi.yaml)
    and the flow around all of this is in [README.md](./README.md).

    No street address ever appears in an event or an SSE message.

servers:
  rabbitmq:
    host: localhost:5672
    protocol: amqp
    description: RabbitMQ broker, local development. Not reachable from outside.
  gateway:
    host: localhost
    protocol: https
    description: Caddy. The only publicly exposed service.

channels:
  requestCreated:
    address: request.created
    title: Routing key request.created
    description: Published to the exchange below, one message per created request.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: routingKey
        exchange:
          name: ecocollect.events
          type: topic
          durable: true
          autoDelete: false
          vhost: /
    messages:
      requestCreated:
        $ref: '#/components/messages/RequestCreated'

  requestEventsQueue:
    address: null
    title: The queue of one notification instance
    description: |
      Every notification instance declares its own queue when it starts and binds it to the
      exchange with `request.*`, so every instance receives every event. The SSE connections
      live in the memory of one instance, so a queue shared between instances would hand an
      event to an instance that may not hold the user's connection, and the signal would be
      lost without anyone noticing. The queue is exclusive, auto-delete and not durable, and
      the broker picks its name. Events published while no instance is running are dropped,
      which is fine for a signal.
    servers:
      - $ref: '#/servers/rabbitmq'
    bindings:
      amqp:
        is: queue
        queue:
          durable: false
          exclusive: true
          autoDelete: true
          vhost: /
    messages:
      requestCreated:
        $ref: '#/components/messages/RequestCreated'

  signalStream:
    address: /api/events
    title: Server-Sent Events stream
    description: |
      Opened once after login by `EventSource` with the session cookie. The first thing the
      server writes on a new stream is a `: ready` comment line.
    servers:
      - $ref: '#/servers/gateway'
    messages:
      signal:
        $ref: '#/components/messages/SseSignal'

operations:
  publishRequestCreated:
    action: send
    channel:
      $ref: '#/channels/requestCreated'
    title: Pickup service publishes RequestCreated
    summary: One event per created request, so a 3-category submission sends 3.
    description: |
      Sent by the outbox publisher in the pickup service. The event is saved in the
      same database transaction as the request, so it is never lost before it reaches RabbitMQ.
      A background loop publishes it with publisher confirms on, and marks the outbox row as
      sent only after RabbitMQ confirms. After that it is up to each consumer: an event that
      arrives while no notification instance is running is dropped, which is fine for a signal,
      and a consumer that needs more (stored notifications, email) must keep its own queue.
    bindings:
      amqp:
        deliveryMode: 2
    messages:
      - $ref: '#/channels/requestCreated/messages/requestCreated'

  receiveRequestCreated:
    action: receive
    channel:
      $ref: '#/channels/requestEventsQueue'
    title: Notification service consumes RequestCreated
    description: |
      The notification service has no database for Oct 28. Each instance reads its own queue. For each event it sends a
      `REQUEST_CREATED` signal to the resident (`data.residentUid`) and a
      `NEW_MATCHING_REQUEST` signal to each uid in `matchedVolunteerUids`, and then
      acknowledges the message (manual ack, so an unacked message is delivered again).
      The recipients come straight from the event, there is no matching in this service.
      A repeated delivery sends the signal again, which only costs an extra refetch.
    bindings:
      amqp:
        ack: true
    messages:
      - $ref: '#/channels/requestEventsQueue/messages/requestCreated'

  pushSignal:
    action: send
    channel:
      $ref: '#/channels/signalStream'
    title: Notification service pushes a signal over SSE
    description: |
      When a connection opens, the service registers it first and then writes `: ready` right away.
      A comment line is ignored by `EventSource`, but writing it flushes the headers, so `onopen` fires
      at once and not after the first ping. The order matters: by the time the frontend refetches in
      `onopen`, the connection is already registered and can receive signals, so none can slip
      through in between.

      One `signal` message is written to every open connection of each recipient, so
      several tabs all get it. A recipient with no open connection gets nothing. The frontend
      refetches whenever the stream opens (`EventSource` `onopen`), the first time and after every reconnect,
      so a missed signal costs nothing. Roughly every 25 seconds the server also sends a
      comment line, `: ping`, to keep the connection open and to find dead connections.
    messages:
      - $ref: '#/channels/signalStream/messages/signal'

components:
  messages:
    RequestCreated:
      name: RequestCreated
      title: A resident created a pickup request
      contentType: application/json
      description: |
        AMQP properties: `messageId` is the `eventId`, `contentType` is `application/json`,
        and the message is persistent (`deliveryMode` 2).
      correlationId:
        location: $message.payload#/eventId
      payload:
        $ref: '#/components/schemas/RequestCreatedPayload'
      examples:
        - name: Two laptops with two matched volunteers
          payload:
            eventId: 6f1c9c2e-3b0e-4f0f-9d57-2c2f6a1d8e11
            type: RequestCreated
            version: 1
            occurredAt: '2026-10-28T16:15:00Z'
            data:
              requestId: 0b7e3f2a-6d1c-4a52-9a43-6a1f5e0f1c11
              residentUid: firebaseUid_abc
              categoryId: laptops
              categoryName: Computers/Laptops
              quantity: 2
              estimatedWeightKg: 5.0
              postalCode: T2P1J9
              windows:
                - date: '2026-10-30'
                  startHour: 14
              expiresAt: '2026-11-27T16:15:00Z'
              matchedVolunteerUids: [firebaseUid_v1, firebaseUid_v2]

    SseSignal:
      name: signal
      title: A signal for the signed-in user
      contentType: application/json
      description: |
        Sent as a Server-Sent Event, after the `: ready` line that every stream starts with. On the
        wire it is two lines and a blank line:

        ```
        event: signal
        data: <the payload as one line of JSON>
        ```

        There is no `id` line, because nothing is stored: a connection that drops does not
        get the messages it missed.

        The message is only a signal. The frontend refetches from the REST API to get fresh data:
        the available requests for `NEW_MATCHING_REQUEST`, and the resident's own requests
        for `REQUEST_CREATED`. There is no stored inbox to refetch for Oct 28.
        A signal missed while disconnected is not replayed. The frontend refetches in `onopen` instead.
      payload:
        $ref: '#/components/schemas/SseSignalPayload'
      examples:
        - name: A volunteer is told about a new request
          payload:
            type: NEW_MATCHING_REQUEST
            requestId: 0b7e3f2a-6d1c-4a52-9a43-6a1f5e0f1c11

  schemas:
    RequestCreatedPayload:
      type: object
      required: [eventId, type, version, occurredAt, data]
      properties:
        eventId:
          type: string
          format: uuid
          description: Unique per event. It is also the AMQP `messageId`.
        type:
          type: string
          const: RequestCreated
        version:
          type: integer
          const: 1
        occurredAt:
          $ref: ./schemas/common.yaml#/Timestamp
        data:
          type: object
          description: >
            Consumers ignore fields they don't know, so adding a field is not a breaking change.
            There is never a street address in here.
          required:
            - requestId
            - residentUid
            - categoryId
            - categoryName
            - quantity
            - estimatedWeightKg
            - postalCode
            - windows
            - expiresAt
            - matchedVolunteerUids
          properties:
            requestId:
              type: string
              format: uuid
            residentUid:
              type: string
              description: Firebase uid of the resident.
            categoryId:
              type: string
            categoryName:
              type: string
            quantity:
              type: integer
              minimum: 1
            estimatedWeightKg:
              type: number
              exclusiveMinimum: 0
            postalCode:
              $ref: ./schemas/common.yaml#/PostalCode
            windows:
              type: array
              minItems: 1
              maxItems: 3
              items:
                $ref: ./schemas/common.yaml#/PickupWindow
            expiresAt:
              $ref: ./schemas/common.yaml#/Timestamp
            matchedVolunteerUids:
              type: array
              description: >
                Volunteers whose saved postal codes include this request's postal code, without the
                resident. A snapshot taken when the request was created, so later preference changes
                do not affect it. It can be empty.
              items:
                type: string

    SseSignalPayload:
      type: object
      additionalProperties: false
      required: [type, requestId]
      properties:
        type:
          type: string
          enum: [REQUEST_CREATED, NEW_MATCHING_REQUEST]
          description: >
            `REQUEST_CREATED` is the confirmation to the resident.
            `NEW_MATCHING_REQUEST` is the alert to a volunteer.
        requestId:
          type: string
          format: uuid
          description: The request to refetch. Nothing else about it is sent, so there is no street address.
