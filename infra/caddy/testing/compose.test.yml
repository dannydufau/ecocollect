networks:
  internal:
    internal: true
  public: {}

services:
  reward:
    image: traefik/whoami
    command: ["-name", "reward"]
    networks: [internal]

  request:
    image: traefik/whoami
    command: ["-name", "request"]
    networks: [internal]

  notification:
    image: traefik/whoami
    command: ["-name", "notification"]
    networks: [internal]

  frontend:
    image: traefik/whoami
    command: ["-name", "frontend", "-port", "3000"]
    networks: [internal]

  user:
    image: caddy:2
    networks: [internal]
    volumes:
      - ./user-stub.Caddyfile:/etc/caddy/Caddyfile:ro
  gateway:
    image: caddy:2
    ports: ["3030:443"]
    networks: [internal, public]
    volumes:
      - ../Caddyfile:/etc/caddy/Caddyfile:ro
