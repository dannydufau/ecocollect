# TLS for RabbitMQ, added by docker-compose.tls.yml (mounted into /etc/rabbitmq/conf.d/).
# 5672 stays plain for the other services; 5671 is the TLS listener the Notification Service uses.
# Certificates come from infra/rabbitmq/gen-certs.sh, mounted at /etc/rabbitmq/certs.
listeners.tcp.default = 5672
listeners.ssl.default = 5671

ssl_options.cacertfile = /etc/rabbitmq/certs/ca.pem
ssl_options.certfile   = /etc/rabbitmq/certs/server.pem
ssl_options.keyfile    = /etc/rabbitmq/certs/server.key

# Clients prove nothing with a certificate; they still log in with the user and password.
ssl_options.verify               = verify_none
ssl_options.fail_if_no_peer_cert = false
