name: ecocollect
services:
  postgres:                         # service name; also its hostname for other containers
    image: postgres:16              # official image, major version pinned
    restart: unless-stopped         # restarts after crashes or a Docker restart, unless you stopped it
    environment:                    # read by the image on first start to create user, password, db
      POSTGRES_USER: ${POSTGRES_USER:-ecocollect}                                    # default if not set
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env first}       # required, no default
      POSTGRES_DB: ${POSTGRES_DB:-ecocollect}                                        # default if not set
    volumes:
      - pgdata:/var/lib/postgresql/data              # named volume: data survives container restarts
      - ./db/init:/docker-entrypoint-initdb.d:ro     # schema scripts, run once on an empty volume
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"      # your machine's localhost only, not your network
    healthcheck:                    # "healthy" once Postgres accepts connections
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-ecocollect}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?copy .env.example to .env first}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MGMT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  user:
    build:
      context: ./backend
    command: ["node", "src/user/index.ts"]
    restart: unless-stopped
    environment:
      PORT: "80"
      DATABASE_URL: ${USER_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ecocollect}:${RABBITMQ_PASSWORD:?copy .env.example to .env first}@rabbitmq:5672
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase-admin.json
    secrets:
      - firebase-admin.json
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  notification:                     # SSE live updates (issue #25): RabbitMQ events in, /api/events streams out
    build:
      context: ./backend            # same image as the backend, started with a different entry point
    command: ["node", "src/notification/index.js"]
    restart: unless-stopped
    environment:
      PORT: "80"                    # Caddy proxies to notification without a port, which means 80
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ecocollect}:${RABBITMQ_PASSWORD:?copy .env.example to .env first}@rabbitmq:5672
                                    # no DATABASE_URL and no Firebase key: it needs neither
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # the container runs as a normal user, which may then use port 80
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:                    # /api/events answers 401 without X-User-Id, so a 401 means it is up
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/api/events').then((r) => process.exit(r.status === 401 ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  request:                          # Request Service (#102), TypeScript run directly by Node (no build step)
    build:
      context: ./backend            # same image as the backend, started with a different entry point
    command: ["node", "src/request/index.ts"]
    restart: unless-stopped
    environment:
      PORT: "80"                    # Caddy proxies to request without a port, which means 80
      # The one database every service uses, "ecocollect" (contract 2.1): its tables come
      # from db/init, its functions and login from backend/scripts/request/load-db.sh.
      # Connects as its own login, ecocollect_request (contract 2.1), not the admin.
      DATABASE_URL: ${REQUEST_DATABASE_URL:-}
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-ecocollect}:${RABBITMQ_PASSWORD:?copy .env.example to .env first}@rabbitmq:5672
      # ImageKit (contract 2.4): this is the only service that gets the private key.
      # Optional until uploads (#246) read them; that ticket makes the keys required.
      IMAGEKIT_PRIVATE_KEY: ${IMAGEKIT_PRIVATE_KEY:-}
      IMAGEKIT_PUBLIC_KEY: ${IMAGEKIT_PUBLIC_KEY:-}
      IMAGEKIT_URL_ENDPOINT: ${IMAGEKIT_URL_ENDPOINT:-}
      IMAGEKIT_ROOT_FOLDER: ${IMAGEKIT_ROOT_FOLDER:-/ecocollect}   # upload folders start with this (6.2)
      DEMO_MODE: ${DEMO_MODE:-false}                              # true only in the demo stack (17.5)
    sysctls:
      net.ipv4.ip_unprivileged_port_start: 0   # the container runs as a normal user, which may then use port 80
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:                    # /health needs no gateway headers
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:80/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:                         # public Firebase web config, baked into the browser code at build time
        NEXT_PUBLIC_FIREBASE_API_KEY: ${NEXT_PUBLIC_FIREBASE_API_KEY:?add the Firebase web config to .env, see .env.example}
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN:-ecocollect-uofc.firebaseapp.com}
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${NEXT_PUBLIC_FIREBASE_PROJECT_ID:-ecocollect-uofc}
        NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET:-}
        NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID:-}
        NEXT_PUBLIC_FIREBASE_APP_ID: ${NEXT_PUBLIC_FIREBASE_APP_ID:-}
    restart: unless-stopped

  caddy:                            # the gateway, the only way in: https://localhost
    image: caddy:2
    restart: unless-stopped
    ports:
      - "127.0.0.1:80:80"           # only redirects to https
      - "127.0.0.1:443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # keeps Caddy's local certificate authority, so you trust it in the browser only once
      - caddy_config:/config
    depends_on:
      request:
        condition: service_healthy
      user:
        condition: service_healthy
      frontend:
        condition: service_started
    # Not waiting on notification on purpose: if it is down, only live updates stop
    # (Caddy answers 502 for /api/events) and the rest of the app keeps working.

volumes:
  pgdata:                           # declares the named volume
  rabbitmqdata:
  caddy_data:
  caddy_config:

secrets:
  firebase-admin.json:              # mounted in the user service at /run/secrets/firebase-admin.json
    file: ./secrets/firebase-admin.json
